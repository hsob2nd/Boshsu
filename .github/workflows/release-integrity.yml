name: Release integrity
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to verify
        required: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify checksums, clean runtime and corresponding source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python .github/scripts/verify_release.py
  cpu-regression:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Portable-host contracts and source-compiled account/PP fixtures
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: .github/scripts/run_cpu.ps1 -Tag $env:RELEASE_TAG
